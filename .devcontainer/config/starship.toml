# ============================================================================
#  Starship Configuration - Claude Code Dev Container (C)
#  https://starship.rs
# ============================================================================

"$schema" = 'https://starship.rs/config-schema.json'

# Prompt format - two-line layout
format = """
$container$hostname$directory$git_branch$git_status$git_state
$c$character"""

# Right-side prompt
right_format = """$cmd_duration$time"""

add_newline = true
command_timeout = 500

# ----------------------------------------------------------------------------
#  Container - Shows when inside a container
# ----------------------------------------------------------------------------
[container]
symbol = " "
style = "bold 208"
format = '[$symbol$name]($style) '
disabled = false

# ----------------------------------------------------------------------------
#  Hostname - Only show when in SSH (indicates remote)
# ----------------------------------------------------------------------------
[hostname]
ssh_only = true
ssh_symbol = " "
style = "bold cyan"
format = '[$ssh_symbol$hostname]($style) '
disabled = false

# ----------------------------------------------------------------------------
#  Directory - Current path with nice colors
# ----------------------------------------------------------------------------
[directory]
style = "bold blue"
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 4
truncate_to_repo = true
read_only = "  "
read_only_style = "red"
home_symbol = "~"

[directory.substitutions]
"/workspace" = " "
"Documents" = " "
"Downloads" = " "

# ----------------------------------------------------------------------------
#  Git Branch
# ----------------------------------------------------------------------------
[git_branch]
symbol = " "
style = "bold green"
format = 'on [$symbol$branch(:$remote_branch)]($style) '
truncation_length = 25
truncation_symbol = "..."

# ----------------------------------------------------------------------------
#  Git Status - Shows state with colors
# ----------------------------------------------------------------------------
[git_status]
style = "bold yellow"
format = '([$all_status$ahead_behind]($style) )'
conflicted = " "
ahead = "${count}"
behind = "${count}"
diverged = "${ahead_count}${behind_count}"
untracked = "?${count}"
stashed = " "
modified = "!${count}"
staged = "+${count}"
renamed = "${count}"
deleted = "${count}"

# ----------------------------------------------------------------------------
#  Git State (rebase, merge, etc.)
# ----------------------------------------------------------------------------
[git_state]
style = "bold red"
format = '[\($state( $progress_current/$progress_total)\)]($style) '
rebase = "REBASING"
merge = "MERGING"
revert = "REVERTING"
cherry_pick = "CHERRY-PICKING"
bisect = "BISECTING"
am = "AM"
am_or_rebase = "AM/REBASE"

# ----------------------------------------------------------------------------
#  C - Shows C/C++ compiler version (prominent for C projects)
# ----------------------------------------------------------------------------
[c]
symbol = " "
style = "bold 208"
format = 'via [$symbol($version )]($style)'
detect_files = ["Makefile", "makefile", "CMakeLists.txt"]
detect_extensions = ["c", "h"]

# ----------------------------------------------------------------------------
#  Character - Prompt symbol
# ----------------------------------------------------------------------------
[character]
success_symbol = "[](bold green)"
error_symbol = "[](bold red)"
vimcmd_symbol = "[](bold purple)"

# ----------------------------------------------------------------------------
#  Command Duration - Shows for long-running commands
# ----------------------------------------------------------------------------
[cmd_duration]
min_time = 2_000  # Show only if command takes > 2s
style = "bold 240"
format = '[$duration]($style) '
show_milliseconds = false

# ----------------------------------------------------------------------------
#  Time - Show current time
# ----------------------------------------------------------------------------
[time]
disabled = false
style = "bold 240"
format = '[$time]($style)'
time_format = "%H:%M"

# ----------------------------------------------------------------------------
#  Disabled modules (reduce noise)
# ----------------------------------------------------------------------------
[aws]
disabled = true

[gcloud]
disabled = true

[azure]
disabled = true

[nodejs]
disabled = true

[python]
disabled = true

[ruby]
disabled = true

[rust]
disabled = true

[package]
disabled = true

[docker_context]
disabled = false
symbol = " "
style = "bold cyan"
format = '[$symbol$context]($style) '
only_with_files = true

[helm]
disabled = true

[terraform]
disabled = true

[kubernetes]
disabled = true

[java]
disabled = true

[kotlin]
disabled = true

[gradle]
disabled = true
